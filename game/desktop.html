<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercy’s Last Grain</title>
<link rel="preload" href="mercy-granary.jpg" as="image">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="UiTheme.css">
<script defer src="DisplayText.js"></script>
<script defer src="desktop.js"></script>
<script defer src="desktop-updates.js"></script>
</head>
<body class="title-page">
<main class="title-shell">
 <header class="title-heading" aria-labelledby="official-title">
  <h1 id="official-title" lang="en">Mercy’s Last Grain</h1>
  <p class="title-tagline" lang="en">The year we won, the harvest failed.</p>
 </header>
 <p id="notice" class="notice" role="status"></p>
 <section id="menu" aria-label="Mercy’s Last Grain">
  <div id="checking" role="status">로그인 확인 중…</div>
  <p id="nickname" class="nickname" hidden></p>
  <nav id="guest" aria-label="로그인 메뉴" hidden>
   <button data-open="register">회원가입</button>
   <button data-open="login">로그인</button>
  </nav>
  <nav id="player" aria-label="게임 메뉴" hidden>
   <button id="continue" data-launch="continue">계속하기<small id="summary"></small></button>
   <button id="new" data-launch="new">새 게임</button>
  </nav>
  <nav aria-label="공통 메뉴">
   <button id="retry" hidden>다시 시도</button>
   <button data-open="settings">설정</button>
   <button id="account" data-open="account" hidden>계정</button>
   <button id="exit">종료</button>
  </nav>
  <div class="updates" id="updates" aria-label="게임 업데이트" hidden>
   <p id="update-message" role="status">새 버전을 확인하고 있습니다.</p>
   <ul id="update-notes" hidden></ul>
   <progress id="update-progress" max="100" value="0" hidden></progress>
   <button id="update-button" type="button" hidden>업데이트</button>
  </div>
 </section>
 <section id="panel" class="panel" aria-labelledby="panel-title" hidden>
  <h2 id="panel-title"></h2>
  <p id="panel-error" role="alert"></p>
  <form id="form" novalidate hidden>
   <label for="id">아이디</label>
   <input id="id" name="id" autocomplete="username" maxlength="24" aria-describedby="id-error">
   <small class="field-error" id="id-error"></small>
   <label for="password">비밀번호</label>
   <div class="password-row">
    <input id="password" name="password" type="password" maxlength="128" aria-describedby="password-error">
    <button id="visibility" type="button" aria-pressed="false" aria-label="비밀번호 표시">보기</button>
   </div>
   <small class="field-error" id="password-error"></small>
   <div id="nick-field">
    <label for="nick">닉네임</label>
    <input id="nick" name="nickname" autocomplete="nickname" maxlength="24" aria-describedby="nickname-error">
    <small class="field-error" id="nickname-error"></small>
   </div>
   <button id="submit" class="action" type="submit"></button>
  </form>
  <div id="settings" hidden>
   <label for="display">화면 모드</label>
   <select id="display"><option value="window">창 모드</option><option value="full">전체 화면</option></select>
   <label for="quality">그래픽 품질</label>
   <select id="quality"><option value="0">성능</option><option value="1">균형</option><option value="2">품질</option></select>
   <label for="volume">효과음 <output id="volume-label" for="volume"></output></label>
   <input id="volume" type="range" min="0" max="100" step="5">
  </div>
  <div id="account-panel" hidden>
   <p id="account-name"></p>
   <button id="switch">계정 전환</button>
   <button id="logout">로그아웃</button>
   <button id="import-button">브라우저 저장 가져오기</button>
   <input id="import" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="confirm" hidden>
   <p id="confirm-text"></p>
   <button id="confirm-action" class="action"></button>
  </div>
  <button id="back" class="back" type="button">뒤로</button>
 </section>
 <div id="loading" class="loading" role="status" hidden></div>
</main>
<footer><span>키보드 · 방향키 / 확인 / 뒤로</span><span>게임패드 · 방향 패드 / A / B</span></footer>
</body>
</html>
