 for(const [a,b,c,d] of [[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]])quad(points[d],points[c],points[b],points[a],tint,material);
}
function texturedQuad(corners,tile,brightness=1){
 const normal=unit(cross(sub(corners[1],corners[0]),sub(corners[2],corners[0])));
 const uv=[[0,1],[1,1],[1,0],[0,0]];
 for(const i of [0,1,2,0,2,3])verts.push(...corners[i],...normal,...uv[i],brightness,tile);
}
function appendModel(data,x,y,z,scale,angle,tile,headReplaced=false){

  const id=objectKey("stone",x,z);
  if(scale<.56&&collected(id))return;
  registerRock(data,x,y,z,scale,angle,scale<.56?{id,type:"stone",x,z,reach:2.25}:null);
 }
 const c=Math.cos(angle),s=Math.sin(angle);
 for(let i=0;i<data.length;i+=8){
  if(headReplaced&&i%24===0&&Math.min(data[i+1],data[i+9],data[i+17])>1.97){i+=16;continue}
  const a=data[i],b=data[i+1],d=data[i+2],nx=data[i+3],ny=data[i+4],nz=data[i+5],u=data[i+6],v=data[i+7];
  const elder=tile===surface.genzoFace, portrait=tile===surface.face||elder;
  const textureU=elder?.5+(u-.5)*.76:u, textureV=elder?.022+v*.866:v;
  verts.push(x+(a*c+d*s)*scale,y+b*scale,z+(d*c-a*s)*scale,nx*c+nz*s,ny,nz*c-nx*s,
   textureU,textureV,portrait?nz*.5+.5:1,tile);
 }
}
function taper(x,y,z,h,bottom,top,tint,sides=7){
 for(let i=0;i<sides;i++){
  const a=i/sides*Math.PI*2,b=(i+1)/sides*Math.PI*2;
  quad([x+Math.cos(b)*bottom,y,z+Math.sin(b)*bottom],[x+Math.cos(a)*bottom,y,z+Math.sin(a)*bottom],[x+Math.cos(a)*top,y+h,z+Math.sin(a)*top],[x+Math.cos(b)*top,y+h,z+Math.sin(b)*top],shade(tint,.89+(i%4)*.05));
 }
}

function pineLimb(nodes,seed,flex=0){
 const sides=nodes.length>3?11:6, random=rand(seed);
 const ribs=Array.from({length:sides},()=>.83+random()*.32);
 const sections=nodes.map(([x,y,z,r],i)=>{
  const a=nodes[Math.max(0,i-1)], b=nodes[Math.min(nodes.length-1,i+1)];
  const axis=unit(sub(b.slice(0,3),a.slice(0,3)));
  const across=unit(cross(axis,Math.abs(axis[1])>.85?[1,0,0]:[0,1,0]));
  const other=cross(axis,across);
  return ribs.map((ridge,j)=>{
   const theta=j*Math.PI*2/sides;
   const normal=across.map((v,k)=>v*Math.cos(theta)+other[k]*Math.sin(theta));
   return {position:[x,y,z].map((v,k)=>v+normal[k]*r*ridge),normal};
  });
 });
 let v=0;
 for(let i=1;i<sections.length;i++){
  const nextV=v+Math.hypot(...sub(nodes[i].slice(0,3),nodes[i-1].slice(0,3)))*.72;
  for(let j=0;j<sides;j++){
   const next=(j+1)%sides,u=j/sides,nextU=(j+1)/sides;
   const corners=[sections[i-1][j],sections[i-1][next],sections[i][next],sections[i][j]];
   const uv=[[u,v],[nextU,v],[nextU,nextV],[u,nextV]];
   for(const k of [0,1,2,0,2,3]){
    const {position,normal}=corners[k];
    const level=(i-(k<2?1:0))/(sections.length-1);
    verts.push(...position,...normal,...uv[k],1,surface.bark+flex*level);
   }
  }
  v=nextV;
 }
}

function gableBoards(x,z,w,d,eave,ridge){

  if(rise<.07)continue;
  const colorVariation=shade(color("#635547"),.85+random()*.28);
  for(const side of [-1,1])box(xp,eave,z+side*(d*.5+.029),step-.013,rise,.065,colorVariation,0,44);

function clayRoof(x,z,w,d,eave,ridge){

  const inner=row/rows, outer=(row+1)/rows;
  const near=x+side*half*inner,far=x+side*half*outer;
  const top=lerp(ridge,eave,inner)+.037,bottom=lerp(ridge,eave,outer)+.059;
  for(let col=0;col<cols;col++){
   const start=z-span*.5+col*spacing+.008,end=start+spacing-.016,mid=(start+end)*.5;
   const tone=.83+random()*.32, arch=.032+random()*.035;
   const a=[near,top,start],b=[far,bottom,start],c=[far,bottom+arch,mid],d=[near,top+arch,mid];
   const e=[far,bottom,end],f=[near,top,end];

   for(const [p,q,r] of [[a,b,c],[a,c,d],[d,c,e],[d,e,f]]){

function rounded(x,y,z,rx,ry,rz,tint,material=0){

  const a=(j/6-.5)*Math.PI,b=((j+1)/6-.5)*Math.PI,c=i/10*Math.PI*2,d=(i+1)/10*Math.PI*2;
  const corners=[point(a,c),point(b,c),point(b,d),point(a,d)];

function garment(rings,tint,material,folds=.045){
 const segments=32, points=[];
 for(let j=0;j<rings.length;j++){
  const [x,y,z,w,d]=rings[j];
  for(let i=0;i<segments;i++){
   const a=i*Math.PI*2/segments;
   const wrinkle=1+folds*(Math.sin(a*5+y*29)+.36*Math.cos(a*9-y*67));
   points.push([x+Math.sin(a)*w*wrinkle,y+Math.cos(a*3)*folds*.055,z+Math.cos(a)*d*wrinkle]);
  }
 }
 const normals=points.map((_,i)=>{
  const row=Math.floor(i/segments),col=i%segments;
  const next=row*segments+(col+1)%segments,prev=row*segments+(col+segments-1)%segments;
  const up=Math.min(rings.length-1,row+1)*segments+col,down=Math.max(0,row-1)*segments+col;
  return unit(cross(sub(points[next],points[prev]),sub(points[up],points[down])));
 });
 for(let j=0;j<rings.length-1;j++)for(let i=0;i<segments;i++){
  const a=j*segments+i,b=j*segments+(i+1)%segments;
  for(const k of [a,b,b+segments,a,b+segments,a+segments])verts.push(...points[k],...normals[k],...tint,material);
 }
}

function updateLocomotion(dt){

  const keyboardZ=Number(keys.has("w")||keys.has("arrowup"))-Number(keys.has("s")||keys.has("arrowdown"));

  let dx=-x*Math.cos(heading)+z*Math.sin(heading),dz=x*Math.sin(heading)+z*Math.cos(heading);

   dx=marker.x-player.x;dz=marker.y-player.y;
   if(Math.hypot(dx,dz)<.09){
    if(marker.route?.length)Object.assign(marker,marker.route.shift());
    else{selected=marker.id;marker=null;target=null}
    movement.x=movement.z=0;
    dx=dz=0;
   }
  }
  const magnitude=Math.hypot(dx,dz);

  const walkSpeed=s.region===0?2.55:3.6;
  const dashing=keyboard?combat.keyboardDodge!==null&&simulationTime-combat.keyboardDodge>=220:pad.run;
  const horseSpeed=whiteHorse.riding?rideTargetSpeed(dt,magnitude,keys.has("shift")||Boolean(pad.buttons[7])):null;
  const speed=(horseSpeed??(marker?16:dashing?8.8:walkSpeed))*(whiteHorse.riding?1:guarded()?.52:1)*
   inputStrength*(whiteHorse.riding?1:craftMotion())*
   (riverDist(player.x,player.y)<13&&!onAsagiBridge(player.x,player.y)?.58:1);

function directionalMenuButton(buttons,current,dx,dy){

  if(candidate===current)continue;
  const box=candidate.getBoundingClientRect(),cx=(box.left+box.right)/2-x,cy=(box.top+box.bottom)/2-y;

  const overlap=dx?Math.min(box.bottom,origin.bottom)-Math.max(box.top,origin.top):
   Math.min(box.right,origin.right)-Math.max(box.left,origin.left);

  if(score<best){winner=candidate;best=score;}
 }

}

 const current=tabs.findIndex(tab=>tab.matches('[aria-pressed=true],[aria-selected=true]'));

 for(const [id,label] of sections)button(tabs,label,()=>{

 button(body,"목재 보관 및 예약",timberStock);

 if(count("나무 방패")&&count("짧은 검"))for(const item of ["나무 방패","짧은 검"]){

 }
 button(body,"먹고 마시기",eatMenu);

 button(body,"장비",craftGearMenu);
}

 if(graphics&&!s.soilCampaign?.step&&s.region===0&&actionSpot==="station")button(body,"아사기 도착 장면 다시 보기",()=>{

 });

// Positions follow the painted landmarks. Walking uses the corresponding world spot.
function atlasHeading(parent,tag,title,description){
 const heading=document.createElement(tag);
 heading.textContent=title;
 parent.append(heading);
 if(description){
  const copy=document.createElement("p");
  copy.textContent=description;
  parent.append(copy);
 }
 return heading;
}
function atlasPanel(label,title){
 const body=modal(label,title);
 $("dialog-close").textContent="지도 접기";
 return body;
}
function asagiMap(){regionAtlas(0);}
function openMap(){regionAtlas(s.region);}

function railMap(){
 const atStation=actionSpot==="station";
 const body=atlasPanel("세계 지도첩 M","여덟 지역의 길"),quests=activeMapQuests();
 installAtlasLegend(body,["region","home","wood","spot","bridge","exit","wildlife"]);
 const intro=document.createElement("section");intro.className="atlas-intro";body.append(intro);
 atlasHeading(intro,"h3","계곡에서 빙하 만까지","지역 인장을 골라 현재 위치와 이어지는 길, 그곳의 이야기를 살펴보세요.");
 estateMapList(body,regions.map((_,i)=>i));
 const atlas=document.createElement("div");atlas.className="atlas";
 const painting=document.createElement("img");painting.src="assets/atlas-live/world-satellite-terrain-joins.jpg";painting.alt="브뤼넨을 중심으로 여덟 지역이 이어지는 Mercy’s Last Grain의 세계 지도";
 atlas.append(painting);body.append(atlas);
 atlasMapFurniture(atlas);mountAtlasPing(atlas,"world");
 const tip=atlasMarkerTooltip(atlas);
 mountTrailDestinations(body,atlas,tip);
 const detail=document.createElement("div");detail.className="atlasDetail";body.append(detail);
 const points=openWorldTiles.map(([col,row],i)=>[(col*632+worldHubs[i][0]-4)/1896*100,(row*400+worldHubs[i][1]-12)/1200*100]),pins=[];
 const inspect=i=>{
  const region=regions[i],leg=connection(s.region,i);
  detail.replaceChildren();
  pins.forEach((pin,index)=>pin.setAttribute("aria-pressed",String(i===index)));
  const icon=document.createElement("div");icon.className="regionIcon";
  icon.style.backgroundPosition=(i%4)*100/3+"% "+Math.floor(i/4)*100+"%";
  detail.append(icon);
  const info=document.createElement("div");info.className="atlas-place-copy";
  atlasHeading(info,"h3",region.name,region.area+" · "+region.land);
  atlasHeading(info,"p",region.trade).className="atlas-region-note";
  const available=document.createElement("small");available.className="atlas-route-note";
  info.append(available);detail.append(info);
  questMapActions(detail,quests.filter(q=>q.region===i).filter((q,j,list)=>list.findIndex(v=>v.type===q.type&&v.title===q.title)===j));
  button(detail,region.name+" 지역 지도 펼치기",()=>regionAtlas(i));
  if(i===s.region){
   available.textContent="현재 머무는 지역";
   if(i===1)button(detail,"곡물거래소로 걷기",()=>{$("dialog").close();go(brMarket.id);},true);
   if(i===7)button(detail,"남부 초소로 걷기",()=>{$("dialog").close();go(karukPost.id);},true);
   const objective=winterObjectives().find(q=>q[2]===i);
   if(objective&&i!==7)button(detail,"작전 현장으로 걷기",()=>{$("dialog").close();go(objective[3]);},true);
   return;
  }
  openWorldMapDetail(detail,available,i);
  if(!leg)return;
  available.textContent+=" · "+leg[2]+"편 "+leg[3]+"시간";
  button(detail,atStation?regions[i].name+"행 출발":"역까지 걷기",()=>{
   $("dialog").close();
   if(atStation)travel(i);else go("station");
  },true);
 };
 points.forEach(([x,y],i)=>{
  const pin=button(atlas,"",()=>inspect(i));
  pin.className="atlasPin atlas-icon-pin";pin.style.left=x+"%";pin.style.top=y+"%";
  pin.append(atlasIcon("region"));connectAtlasTooltip(pin,tip,regions[i].name,regions[i].land);
  pin.setAttribute("aria-current",i===s.region?"location":"false");
  pins.push(pin);
  if(worldRoads[s.region].some(road=>road.to===i))pin.classList.add("connected");
 });
 inspect(s.region);
 $("dialog").scrollTop=0;
}
hud.onclick=interact;
const controls=document.createElement("nav");controls.className="worldControls";
controls.hidden=true;scene.append(controls);mountGameMenu();
const questCaption=document.createElement("div");
questCaption.id="quest-subtitle";questCaption.hidden=true;questCaption.setAttribute("role","status");
questCaption.append(document.createElement("strong"),document.createElement("span"));scene.append(questCaption);
const radar=document.createElement("div");radar.className="radar";
const radarCanvas=document.createElement("canvas");radarCanvas.width=166;radarCanvas.height=166;radarCanvas.setAttribute("aria-label","주변 지도");
radar.append(radarCanvas);scene.append(radar);
const radarContext=radarCanvas.getContext("2d");
radarContext?.scale(166/144,166/144);
function drawRadar(){
 if(!radarContext)return;
 const c=radarContext, x=player.x,y=player.y,scale=.55;
 radar.classList.toggle("navigation-active",Boolean(marker||trailNavigation)||timberGuide?.region===s.region||districtRoads().filter(road=>road.some(([a,b])=>Math.hypot(a-x,b-y)<16)).length>1);
 c.fillStyle="#b9ad8a";c.fillRect(0,0,144,144);
 function stroke(path,ink,width){
  c.beginPath();
  path.forEach(([a,b],i)=>c[i?"lineTo":"moveTo"](72+(a-x)*scale,72+(b-y)*scale));
  c.strokeStyle=ink;c.lineWidth=width;c.stroke();
 }
 watershedRadarLines(s.region).forEach(line=>stroke(line,"#65858c",13));districtRoads().forEach(road=>stroke(road,"#7c6b50",2));if(s.region===0)stroke(asagiServiceRoad,"#7c6b50",2);
 for(const path of allDirtTrailRoutes(s.region))stroke(path,"#ad8e64",1.35);
 for(const {a,b} of trailConnections[s.region].bridges)stroke([a,b],"#e5d4ad",2.1);
 for(const road of worldRoads[s.region])stroke(road.samples?.map(({x,z})=>[x,z])??[road.edge,road.approach,worldHubs[s.region]],"#92783f",2);
 paintTrailNavigation(c,stroke,scale);
 if(timberGuide?.region===s.region){
  const a=cap(72+(timberGuide.x-x)*scale,9,135),b=cap(72+(timberGuide.z-y)*scale,9,135);
  c.strokeStyle="#3b4e40";c.lineWidth=2;c.fillStyle="#f5d27a";
  c.beginPath();c.arc(a,b,5,0,Math.PI*2);c.fill();c.stroke();
  if(Math.hypot(timberGuide.x-x,timberGuide.z-y)<4)timberGuide=null;
 }
 for(const site of townServices()){
  const sx=72+(site.x-x)*scale,sz=72+(site.z-y)*scale;
  c.fillStyle=townRoles[site.role].paint;c.strokeStyle="#f5d491";
  c.beginPath();c.rect(sx-2.5,sz-2.5,5,5);c.fill();c.stroke();
 }
 for(const p of actStops()){
  c.beginPath();c.arc(72+(p.x-x)*scale,72+(p.y-y)*scale,3,0,Math.PI*2);
  c.fillStyle=p.id===actionSpot?"#932e23":"#3c3428";c.fill();
 }
 c.save();c.translate(72,72);c.rotate(Math.PI-heading);
 c.beginPath();c.moveTo(0,-7);c.lineTo(-4,5);c.lineTo(4,5);c.closePath();c.fillStyle="#852e22";c.fill();c.restore();
 c.fillStyle="#392f23";c.font="bold 11px Georgia";c.fillText("N",68,14);
}
mountPlayerStatus();
actionSpot="station";render();
if(graphics){
 const loadRiggedScene=import("./rigged-scene.mjs?v=fal-coat-strands&wildlife=behavior&pursuit=1")
  .then(()=>window.createRiggedScene(canvas,gl))
  .then(scene=>{riggedScene=scene;if(scene)loadedScene=""})
  .catch(error=>console.warn("Rigged assets unavailable",error));
 loadRegionalScans().catch(error=>console.warn("Regional models unavailable",error));
 Promise.all([loadScenery().catch(error=>console.warn("Detailed scenery unavailable",error)),loadRiggedScene])
  .then(()=>{if(s.introPending)playOpening();requestAnimationFrame(loop)});
}
